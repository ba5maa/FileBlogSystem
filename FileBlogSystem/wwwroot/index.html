<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>File Blog System</title>
    <link rel="stylesheet" href="/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <header>
        <div class="header-content">
            <h1>
                <a href="#" id="home-link" style="text-decoration: none; color: inherit;">File Blog System</a>
            </h1>
            <script>
                document.addEventListener('DOMContentLoaded', function() {
                    var isAuthorized = localStorage.getItem('token') !== null;
                    var homeLink = document.getElementById('home-link');
                    homeLink.setAttribute('href', isAuthorized ? '/feed' : '/welcome');
                });
            </script>
            <nav id="main-nav"></nav>
        </div>
    </header>

    <main id="app-container">
        <div class="loading-spinner">
            <i class="fas fa-spinner fa-spin"></i>
            <p>Loading application...</p>
        </div>
    </main>

    <script src="/script.js"></script>
</body>
</html>
